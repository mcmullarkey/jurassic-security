<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <g fill="#22c55e">
    <!-- Body -->
    <ellipse cx="32" cy="40" rx="18" ry="14"/>

    <!-- Head -->
    <circle cx="28" cy="24" r="10"/>

    <!-- Snout -->
    <ellipse cx="22" cy="24" rx="6" ry="4"/>

    <!-- Eye -->
    <circle cx="30" cy="22" r="2" fill="#fff"/>
    <circle cx="30.5" cy="21.5" r="1" fill="#000"/>

    <!-- Spikes on back -->
    <path d="M 20 32 L 18 28 L 20 28 Z"/>
    <path d="M 26 30 L 24 26 L 26 26 Z"/>
    <path d="M 32 30 L 30 26 L 32 26 Z"/>
    <path d="M 38 32 L 36 28 L 38 28 Z"/>

    <!-- Tail -->
    <path d="M 48 42 Q 56 40 58 36" stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Legs -->
    <rect x="20" y="50" width="4" height="8" rx="2"/>
    <rect x="28" y="50" width="4" height="8" rx="2"/>
    <rect x="36" y="50" width="4" height="8" rx="2"/>
    <rect x="44" y="50" width="4" height="8" rx="2"/>
  </g>
</svg>
